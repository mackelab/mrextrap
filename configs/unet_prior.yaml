# Paper UNet prior. Values equal the legacy config
# train_unet_mean_var_with_gauss_loss_lowlr_aug_warmup4000.yaml, except: dataset paths point into
# run_dir (see paths.yaml) and use_wandb defaults to false (was true).
training:
  lr: 0.0001
  seed: 42
  num_epochs: 2000
  batch_size: 160
  gradient_accumulation_steps: 1
  num_warmup_steps: 4000
  mixed_precision: bf16
  num_workers: 4
  lr_scheduler: cosine
  grad_clip_val: 1.0
  T1: 1.0
  T2: 0.001
  torch_compile: false
  use_wandb: false
  augment_data: true
dataset:
  latents_path_train: ${paths.latents_dir}/train_latent_betas_l1.pt
  latents_path_val: ${paths.latents_dir}/val_latent_betas_l1.pt
  latents_path_test: ${paths.latents_dir}/test_latent_betas_l1.pt
model:
  image_size: [4, 20, 24, 20]
  in_channels: 4
  model_channels: 64
  out_channels: 4
  num_res_blocks: 2
  attention_resolutions: []
  channel_mult: [1, 2]
  num_classes: 1
  emb_bias: true
exp_name: train_unet_mean_var_with_gauss_loss_lowlr_aug_warmup4000
