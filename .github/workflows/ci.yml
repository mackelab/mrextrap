name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.3.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev extras
        # torch is already satisfied by the CPU wheel above; no CUDA wheels are pulled.
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      - name: Tests (CPU, synthetic data, no network)
        env:
          WANDB_MODE: disabled
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q -m "not gpu and not slow"

      - name: Smoke run on synthetic data
        env:
          WANDB_MODE: disabled
          CUDA_VISIBLE_DEVICES: ""
        run: mrextrap smoke
