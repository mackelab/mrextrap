[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrextrap"
version = "0.1.0"
description = "MRExtrap: extrapolating longitudinal brain MRI in a learned latent space (code release)."
readme = "README.md"
requires-python = ">=3.10,<3.12"
# LICENSE is intentionally not declared here yet (author decision pending).
dependencies = [
    # Pins follow the requirements.txt stored in the W&B code snapshots of the paper runs.
    "torch==2.3.1",
    "accelerate==0.31.0",
    "diffusers>=0.29.1,<0.33",  # paper runs used 0.29.1 (diffusion prior) and 0.32.1 (UNet prior)
    "monai==1.3.1",
    "lpips==0.1.4",
    "torch-ema==0.3",
    "safetensors>=0.4",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.6.0",
    "nibabel==5.2.1",
    "SimpleITK>=2.3",
    "einops>=0.7",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
train = ["wandb>=0.16"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
mrextrap = "mrextrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrextrap"]

# ship the configs (incl. configs/smoke for `mrextrap smoke`) inside the wheel
[tool.hatch.build.targets.wheel.force-include]
"configs" = "mrextrap/_configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires a CUDA device",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E401", "E402"]
